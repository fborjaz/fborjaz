name: Generate profile summary cards

on:
  schedule: # diario 05:00 UTC (00:00 Ecuador)
    - cron: "0 5 * * *"

  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -5
          BRANCH_NAME: main
          AUTO_PUSH: true
